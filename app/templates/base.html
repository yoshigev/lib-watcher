<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ settings.LIBRARY_DISPLAY_NAME }} - מעקב זמינות ספרים{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <header class="bg-gradient-to-l from-blue-900 via-indigo-900 to-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand -->
                <a href="/" class="flex items-center space-x-3 space-x-reverse">
                    <span class="text-2xl">📚</span>
                    <div>
                        <span class="font-extrabold text-lg tracking-tight block">{{ settings.LIBRARY_DISPLAY_NAME }}</span>
                        <span class="text-xs text-blue-200 block">מערכת התראות זמינות ספרים</span>
                    </div>
                </a>

                {% if user %}
                <!-- Nav Links -->
                <nav class="flex items-center space-x-6 space-x-reverse">
                    <a href="/" class="text-sm font-medium hover:text-blue-300 transition-colors {% if request.url.path == '/' %}text-blue-300 border-b-2 border-blue-400 pb-1{% endif %}">
                        📋 הספרים שלי
                    </a>
                    <a href="/search" class="text-sm font-medium hover:text-blue-300 transition-colors {% if request.url.path == '/search' %}text-blue-300 border-b-2 border-blue-400 pb-1{% endif %}">
                        🔍 חיפוש בקטלוג
                    </a>
                </nav>

                <!-- User & Logout -->
                <div class="flex items-center space-x-4 space-x-reverse">
                    <span class="text-xs text-slate-300 bg-blue-800/60 px-3 py-1.5 rounded-full border border-blue-700/50">
                        👤 {{ user.username }} ({{ user.email }})
                    </span>
                    <a href="/logout" class="text-xs font-semibold text-rose-300 hover:text-rose-100 bg-rose-900/40 hover:bg-rose-900/60 px-3 py-1.5 rounded-lg border border-rose-800/50 transition-all">
                        יציאה
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <div class="max-w-6xl mx-auto px-4">
            מערכת ניטור קטלוג ספרייה • בדיקה תקופתית אוטומטית
        </div>
    </footer>
</body>
</html>
