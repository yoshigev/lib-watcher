name: Library Availability Checker (Cron)

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  check-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Library Availability Check Endpoint
        run: |
          echo "Calling library watcher check endpoint..."
          curl -s -f -X GET "${{ secrets.APP_URL }}/api/cron/check?secret=${{ secrets.CRON_SECRET }}" || {
            echo "Failed to call check endpoint"
            exit 1
          }
