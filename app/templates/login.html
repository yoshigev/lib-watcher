{% extends "base.html" %}

{% block title %}התחברות | {{ settings.LIBRARY_DISPLAY_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 text-3xl mb-4">
                🔐
            </div>
            <h1 class="text-2xl font-bold text-slate-900">כניסה למערכת</h1>
            <p class="text-sm text-slate-500 mt-1">מערכת התראות זמינות ספרים</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium flex items-center gap-2">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">שם משתמש</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">סיסמה</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition text-sm">
            </div>

            <button type="submit"
                    class="w-full py-3 px-4 bg-gradient-to-r from-blue-700 to-indigo-700 hover:from-blue-800 hover:to-indigo-800 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 text-sm">
                התחבר
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-400">
            הגישה מיועדת למשתמשים מורשים בלבד
        </div>
    </div>
</div>
{% endblock %}
